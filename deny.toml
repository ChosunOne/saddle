# Dependency policy for the workspace (D200). `cargo deny check` decides it; AGENTS.md says when to
# run it. `unmaintained`, `unsound` and `yanked` are real failures here, not warnings: a harness
# whose whole claim is that authority is declared cannot leave its own supply chain undecided.

[graph]
# The platforms this workspace is built for: Linux for the binary (D18, D19) and wasm32 for the
# shipped guest tools (D146, D147). A crate reachable only from some other target is not in the
# graph, and so not checked.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# Every crate in the graph, not only the ones this workspace names directly: a dependency nobody
# is maintaining is the same fact whether it arrived by one edge or five.
unmaintained = "all"
unsound = "all"
yanked = "deny"
# Each entry is an accepted risk, written where the tool that reports it can read it, and the
# answer is a reason rather than a version requirement this repository cannot move. A warning that
# an entry is unused says the risk is gone, and the entry goes with it.
ignore = [
    # typst 0.15 typesets every formula and takes its citation line from citationberg 0.7, which
    # requires quick-xml ^0.38.1; the fixed 0.41 cannot be selected until that does. Neither
    # advisory is reachable from here: the harness compiles math markup, never a bibliography, and
    # the parsing while it does is bounded by the formula it was given rather than by a document
    # from the network.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.38 comes from typst's citationberg; no untrusted XML is parsed" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.38 comes from typst's citationberg; no untrusted XML is parsed" },
    # No patched version exists, and it is unmaintained rather than vulnerable: humantime formats
    # and parses RFC3339 timestamps in the audit log, the session store and the status line.
    # Replacing it is a source change of its own (docs/plan.md §8).
    { id = "RUSTSEC-2026-0542", reason = "unmaintained, not vulnerable; replacing it is tracked in docs/plan.md §8" },
    # The rest are unmaintained crates inside the two presentation lines. Nothing selects them out
    # of a workspace manifest, so no version requirement here could move them: syntect 5.3 (D80)
    # loads its grammars through yaml-rust and bincode 1, and typst 0.15 (D165) lays text out with
    # ttf-parser and rustybuzz and cites with hayagriva's serde_yaml and paste.
    { id = "RUSTSEC-2024-0320", reason = "yaml-rust, required by syntect 5.3 (D80)" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml, required by typst 0.15's serde_yaml (D165)" },
    { id = "RUSTSEC-2024-0436", reason = "paste, required by typst 0.15's hayagriva (D165)" },
    { id = "RUSTSEC-2025-0141", reason = "bincode 1, required by syntect 5.3 (D80)" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser, required by typst 0.15 (D165)" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz, required by typst 0.15 (D165)" },
]

[licenses]
# Licence text is compared against the SPDX corpus strictly, so a crate whose file merely resembles
# a licence is reported instead of assumed.
confidence-threshold = 0.93
# The closed set this workspace accepts: permissive licences only, plus the two that are a
# statement about data rather than about code (Unicode-3.0 for the ICU tables, CDLA-Permissive-2.0
# for the root certificates webpki-roots carries). A crate under any other licence fails, and the
# answer is a decision in docs/plan.md, not a line here.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
# Duplicates are reported, not forbidden: the wasmtime line and the typst line each carry their own
# crates, and a duplicate outside them is a signal to read rather than a gate. A
# wildcard version requirement from a registry is an error, while the workspace's own path
# dependencies — unpublished, so exempt from what crates.io requires — are not.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Each of these would bring a second implementation of something this build already has one of.
# rustls is the only TLS stack (D101), and git is a command the sandbox runs, not a library here.
deny = [
    { crate = "git2", use-instead = "git cli" },
    { crate = "libgit2-sys", use-instead = "git cli" },
    { crate = "native-tls", use-instead = "rustls" },
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
]
skip-tree = [
    { crate = "wasmtime", reason = "the runtime line of D14, D201; its internal duplicates are not ours to remove" },
    { crate = "wasmtime-wasi", reason = "the same runtime line" },
    { crate = "typst", reason = "the typesetting line of D165" },
]

[sources]
# Every crate comes from crates.io. A git dependency is a moving target that no lockfile digest can
# hold, so it is refused here rather than reviewed per commit.
unknown-registry = "deny"
unknown-git = "deny"
