[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.lints.clippy]
# Import names at module scope instead of qualifying them at the point of use.
absolute_paths = "deny"
# Also reject local items (including imports) appearing after executable statements.
items_after_statements = "deny"

[workspace.dependencies]
saddle-cap = { path = "crates/saddle-cap" }
saddle-policy = { path = "crates/saddle-policy" }
saddle-sandbox = { path = "crates/saddle-sandbox" }
saddle-wit = { path = "crates/saddle-wit" }

# D14, D127: one deliberately pinned runtime line; 36 supports the workspace's Rust 1.88 MSRV.
# The future wasmtime-wasi-http adapter must use the same exact version.
wasmtime = { version = "=36.0.20", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "=36.0.20", default-features = false }
wit-bindgen = { version = "=0.45.0", default-features = false, features = ["macros", "realloc", "std"] }
wat = "=1.236.1"
wit-component = "=0.238.1"

anyhow = "1"
cap-std = "4"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
base64 = "0.22"
humantime = "2"
landlock = "0.4.7"
libc = "0.2"
seccompiler = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.3"
tempfile = "3"
thiserror = "2"
toml = "1"
# Syntax highlighting (D80): the grammars, and bat's larger set of them.
syntect = { version = "5.3", default-features = false, features = [
    "parsing",
    "regex-fancy",
] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
ureq = "3.5"
# The ChatGPT backend's WebSocket transport (D101): tungstenite's client, over the rustls that
# ureq already brings, so there is one TLS stack in the build.
tungstenite = { version = "0.30", features = ["url", "rustls-tls-webpki-roots"] }
ratatui = "0.30"
pulldown-cmark = { version = "0.13", default-features = false }
unicode-width = "0.2"
toml_edit = "0.25"
similar = "3"
regex = "1"
# The session store (D53). Bundled, so no system SQLite is required to build or run.
rusqlite = { version = "0.41", features = ["bundled", "hooks", "limits"] }
