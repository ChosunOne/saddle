[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
saddle-cap = { path = "crates/saddle-cap" }
saddle-policy = { path = "crates/saddle-policy" }
saddle-sandbox = { path = "crates/saddle-sandbox" }

anyhow = "1"
cap-std = "4"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
base64 = "0.22"
humantime = "2"
landlock = "0.4.7"
libc = "0.2"
seccompiler = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.3"
tempfile = "3"
thiserror = "2"
toml = "1"
# Syntax highlighting (D80): the grammars, and bat's larger set of them.
syntect = { version = "5.3", default-features = false, features = [
    "parsing",
    "regex-fancy",
] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
ureq = "3.5"
ratatui = "0.30"
pulldown-cmark = { version = "0.13", default-features = false }
unicode-width = "0.2"
toml_edit = "0.25"
similar = "3"
regex = "1"
# The session store (D53). Bundled, so no system SQLite is required to build or run.
rusqlite = { version = "0.41", features = ["bundled", "hooks", "limits"] }
