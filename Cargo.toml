[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.100"
publish = false

[workspace.lints.rust]
# An item nothing reaches is either a bug or a fossil. The compiler decides which, not a later
# reader: `host_interfaces` was both, and a passing test kept it looking maintained.
dead_code = "deny"
# An import is a name a module decides to depend on. One nothing uses is a stale claim about that.
unused_imports = "deny"

[workspace.lints.clippy]
# Import names at module scope instead of qualifying them at the point of use.
absolute_paths = "deny"
# Also reject local items (including imports) appearing after executable statements.
items_after_statements = "deny"
# No glob imports: every name arrives by a `use` that says where it came from.
wildcard_imports = "deny"
# `use serde;` names a crate without importing anything a reader needs told.
single_component_path_imports = "deny"

[workspace.dependencies]
saddle-standard = { path = "crates/saddle-standard" }
saddle-limits = { path = "crates/saddle-limits" }
saddle-cap = { path = "crates/saddle-cap" }
saddle-policy = { path = "crates/saddle-policy" }
saddle-sandbox = { path = "crates/saddle-sandbox" }
saddle-wit = { path = "crates/saddle-wit" }
saddle-loader = { path = "crates/saddle-loader" }
saddle-sdk = { path = "crates/saddle-sdk" }
saddle-ignore = { path = "crates/saddle-ignore" }

# D14, D127, D201: one runtime line, every WASI crate from it, taken as a semver requirement rather
# than an exact pin. The future wasmtime-wasi-http adapter must come from the same line.
wasmtime = { version = "51", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "51", default-features = false, features = ["p2"] }
wasmtime-wasi-io = { version = "51", default-features = false }
wit-bindgen = { version = "0.63", default-features = false, features = ["macros", "realloc", "std"] }
wat = "1.263"
wit-component = "0.263"
wit-parser = "0.263"

anyhow = "1"
cap-std = "4"
cap-fs-ext = "4"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
base64 = "0.23"
humantime = "2"
landlock = "0.4.8"
libc = "0.2"
seccompiler = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
getrandom = "0.4"
tempfile = "3"
thiserror = "2"
toml = "1"
# Syntax highlighting (D80): the grammars, and bat's larger set of them.
syntect = { version = "5.3", default-features = false, features = [
    "parsing",
    "regex-fancy",
] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
ureq = "3.5"
url = "2"
# The ChatGPT backend's WebSocket transport (D101): tungstenite's client, over the rustls that
# ureq already brings, so there is one TLS stack in the build.
tungstenite = { version = "0.30", features = ["url", "rustls-tls-webpki-roots"] }
ratatui = "0.30"
pulldown-cmark = { version = "0.13", default-features = false }
# Mathematics in the transcript (D165): Typst typesets the formula, and the picture goes to the
# terminal's graphics protocol at one image pixel per screen pixel. `typst-assets` is the bundled
# New Computer Modern family, so no system font is needed and the same formula looks the same
# everywhere.
typst = "0.15"
typst-layout = "0.15"
typst-render = "0.15"
typst-assets = { version = "0.15", features = ["fonts"] }
png = "0.18"
unicode-width = "0.2"
toml_edit = "0.25"
similar = "3"
regex = "1"
memchr = "2"
# The session store (D53). Bundled, so no system SQLite is required to build or run.
rusqlite = { version = "0.43", features = ["bundled", "hooks", "limits"] }

[workspace.metadata.dylint]
libraries = [{ path = "lints/qualified-paths" }]
